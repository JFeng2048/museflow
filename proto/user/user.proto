syntax = "proto3";

package user;

// Go 包路径：生成的代码位于 proto/user 目录下，包名为 userpb
option go_package = "github.com/museflow/proto/user;userpb";

// UserService 用户服务，负责注册、登录、令牌刷新、登出与用户信息查询。
//
// 认证采用双令牌模式：
//   - access token：短期（默认 1h），无状态 JWT，由网关中间件本地验签 + 黑名单校验
//   - refresh token：长期（默认 30d），JWT + Redis 白名单，由网关写入 HttpOnly Cookie
service UserService {
  // Register 用户注册（email + password）
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login 用户登录，签发 access + refresh 双令牌
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh 使用 refresh token 换取新的 access token（refresh 不轮换）
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout 登出：删除 refresh 白名单 + 将 access token 加入黑名单
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // GetProfile 获取用户信息
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // ValidateToken 校验 access token（供网关鉴权中间件使用，含黑名单检查）
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // ---- 用户管理 ----

  // UpdateProfile 更新用户个人信息（昵称 / 头像 / 简介）
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // ChangePassword 修改密码（需验证旧密码，成功后清理权限缓存）
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // SendResetCode 发送密码重置验证码到邮箱（邮箱不存在时静默成功，避免账号枚举）
  rpc SendResetCode(SendResetCodeRequest) returns (SendResetCodeResponse);

  // ResetPassword 校验验证码并重置密码（验证码一次性使用）
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // GetUserByUUID 根据 UUID 查询用户（供其他服务调用）
  rpc GetUserByUUID(GetUserByUUIDRequest) returns (GetUserByUUIDResponse);

  // ---- 权限（供网关调用）----

  // GetUserPermissions 获取用户权限编码列表（缓存优先，未命中查库后回填）
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (GetUserPermissionsResponse);

  // CheckPermission 校验用户是否拥有指定权限
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // ClearUserCache 清理用户权限缓存（管理员或权限变更后调用）
  rpc ClearUserCache(ClearUserCacheRequest) returns (ClearUserCacheResponse);

  // ---- 会话管理 ----

  // ListSessions 查看当前用户的活跃会话列表
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // RevokeSession 强制下线指定会话（自身或管理员）
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // ---- 管理后台（需 admin 权限，由网关校验）----

  // ListUsers 用户列表（分页、筛选、排序）
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUserDetail 用户详情（含角色列表）
  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse);

  // UpdateUserStatus 冻结 / 解冻 / 注销用户
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (UpdateUserStatusResponse);

  // AssignRole 为用户分配角色（分配后清理该用户权限缓存）
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);

  // ListRoles 角色列表
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // CreateRole 创建角色
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // UpdateRole 编辑角色（编辑后清理相关用户权限缓存）
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);

  // DeleteRole 删除角色（删除后清理相关用户权限缓存）
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // ListPermissions 权限列表
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);

  // SetRolePermissions 为角色分配权限（分配后清理相关用户权限缓存）
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse);

  // ListAuditLogs 审计日志列表（按用户 / 操作类型 / 时间筛选，分页）
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);

  // ---- 第三方登录 ----

  // BindOAuth 为当前用户绑定第三方账号
  rpc BindOAuth(BindOAuthRequest) returns (BindOAuthResponse);

  // UnbindOAuth 解绑第三方账号
  rpc UnbindOAuth(UnbindOAuthRequest) returns (UnbindOAuthResponse);

  // ListOAuthBindings 列出用户已绑定的第三方账号
  rpc ListOAuthBindings(ListOAuthBindingsRequest) returns (ListOAuthBindingsResponse);

  // OAuthLogin 通过第三方账号登录（未绑定时自动注册）
  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
}

// UserInfo 对外暴露的用户信息，使用 uuid 作为对外标识，不暴露自增 id。
message UserInfo {
  string uuid = 1;                 // 用户全局唯一标识
  string email = 2;                // 邮箱（登录账号）
  string phone = 3;                // 手机号，可为空
  string nickname = 4;             // 昵称
  string avatar_url = 5;           // 头像 URL
  string bio = 6;                  // 个人简介
  int32 status = 7;                // 状态: 1=正常, 2=冻结, 3=已注销, 4=待审核
  bool email_verified = 8;         // 邮箱是否已验证
  bool phone_verified = 9;         // 手机号是否已验证
  bool mfa_enabled = 10;           // 是否开启 MFA
  int64 last_login_at = 11;        // 最后登录时间（Unix 秒，0 表示从未登录）
  int64 created_at = 12;           // 注册时间（Unix 秒）
}

// DeviceContext 设备上下文，用于生成设备指纹防止令牌跨设备盗用。
message DeviceContext {
  string device_id = 1;            // 设备 ID（客户端 Cookie 携带，缺失时由服务端生成）
  string user_agent = 2;           // User-Agent
  string ip = 3;                   // 客户端 IP
  string device_name = 4;          // 设备名称，用于设备列表展示
}

message RegisterRequest {
  string email = 1;                // 邮箱，必填
  string password = 2;             // 明文密码，必填（服务端 bcrypt 加密）
  string nickname = 3;             // 昵称，为空时由邮箱前缀生成
}

message RegisterResponse {
  UserInfo user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  DeviceContext device = 3;
}

message LoginResponse {
  string access_token = 1;         // access token，网关放响应 body
  string refresh_token = 2;        // refresh token，网关写入 HttpOnly Cookie
  string device_id = 3;            // 设备 ID，网关写入普通 Cookie
  int64 expires_in = 4;            // access token 有效期（秒）
  int64 refresh_expires_in = 5;    // refresh token 有效期（秒）
  UserInfo user = 6;
}

message RefreshRequest {
  string refresh_token = 1;        // 来自 Cookie
  DeviceContext device = 2;        // 用于设备指纹比对
}

message RefreshResponse {
  string access_token = 1;
  int64 expires_in = 2;
}

message LogoutRequest {
  string access_token = 1;         // 来自 Authorization 头，加入黑名单
  string refresh_token = 2;        // 来自 Cookie，删除白名单
}

message LogoutResponse {
  bool success = 1;
}

message GetProfileRequest {
  string uuid = 1;                 // 用户 uuid，由网关从 access token 解析后传入
}

message GetProfileResponse {
  UserInfo user = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string uuid = 2;                 // 校验通过时返回用户 uuid
}

// ==================== 用户管理 ====================

message UpdateProfileRequest {
  string uuid = 1;                 // 用户 uuid（网关从 token 解析）
  string nickname = 2;             // 昵称，留空表示不修改
  string avatar_url = 3;           // 头像 URL，留空表示不修改
  string bio = 4;                  // 个人简介，留空表示不修改
}

message UpdateProfileResponse {
  UserInfo user = 1;
}

message ChangePasswordRequest {
  string uuid = 1;
  string old_password = 2;         // 旧密码，用于校验
  string new_password = 3;         // 新密码，服务端 bcrypt 加密
}

message ChangePasswordResponse {
  bool success = 1;
}

// ---- 密码重置（邮箱验证码）----

message SendResetCodeRequest {
  string email = 1;                // 接收验证码的邮箱
}

message SendResetCodeResponse {
  bool success = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;                 // 邮箱收到的验证码
  string new_password = 3;         // 新密码，服务端 bcrypt 加密
}

message ResetPasswordResponse {
  bool success = 1;
}

message GetUserByUUIDRequest {
  string uuid = 1;
}

message GetUserByUUIDResponse {
  UserInfo user = 1;
}

// ==================== 权限 ====================

message GetUserPermissionsRequest {
  string uuid = 1;
}

message GetUserPermissionsResponse {
  repeated string permissions = 1; // 权限编码列表，如 ["user:read","novel:write"]
}

message CheckPermissionRequest {
  string uuid = 1;
  string permission = 2;           // 待校验的权限编码
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message ClearUserCacheRequest {
  string uuid = 1;
}

message ClearUserCacheResponse {
  bool success = 1;
}

// ==================== 会话管理 ====================

// SessionInfo 单个登录会话（设备）信息。
message SessionInfo {
  string token_id = 1;             // 会话标识，用于强制下线
  string device_id = 2;
  string device_name = 3;
  int64 login_time = 4;            // 登录时间（Unix 秒）
  int64 last_refresh_time = 5;     // 最后刷新时间（Unix 秒）
}

message ListSessionsRequest {
  string uuid = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message RevokeSessionRequest {
  string uuid = 1;                 // 目标用户 uuid
  string token_id = 2;             // 待吊销的会话标识
}

message RevokeSessionResponse {
  bool success = 1;
}

// ==================== 管理后台 ====================

// Pagination 分页参数。
message Pagination {
  int32 page = 1;                  // 页码，从 1 开始
  int32 page_size = 2;             // 每页条数
}

message ListUsersRequest {
  Pagination pagination = 1;
  string keyword = 2;              // 按邮箱 / 昵称模糊搜索，留空不过滤
  int32 status = 3;                // 按状态过滤，0 表示不过滤
  string order_by = 4;             // 排序字段，如 created_at
  bool desc = 5;                   // 是否倒序
}

// AdminUserItem 管理后台用户列表项（含角色编码）。
message AdminUserItem {
  UserInfo user = 1;
  repeated string roles = 2;       // 角色编码列表
  int64 updated_at = 3;            // 最后更新时间（Unix 秒）
}

message ListUsersResponse {
  repeated AdminUserItem users = 1;
  int64 total = 2;                 // 总条数
}

message GetUserDetailRequest {
  string uuid = 1;
}

message GetUserDetailResponse {
  AdminUserItem user = 1;
  repeated string permissions = 2; // 用户最终权限编码列表
}

message UpdateUserStatusRequest {
  string uuid = 1;
  int32 status = 2;                // 1=正常, 2=冻结, 3=已注销, 4=待审核
}

message UpdateUserStatusResponse {
  bool success = 1;
}

message AssignRoleRequest {
  string target_uuid = 1;          // 被分配角色的用户
  string role_code = 2;            // 角色编码
  string operator_uuid = 3;        // 操作人 uuid（审计用）
}

message AssignRoleResponse {
  bool success = 1;
}

// RoleInfo 角色信息。
message RoleInfo {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool is_system = 5;              // 系统内置角色不可改 / 删
  int64 created_at = 6;
}

message ListRolesRequest {
  bool only_system = 1;            // true 时仅返回系统角色
}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

message CreateRoleRequest {
  string code = 1;
  string name = 2;
  string description = 3;
}

message CreateRoleResponse {
  RoleInfo role = 1;
}

message UpdateRoleRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message UpdateRoleResponse {
  bool success = 1;
}

message DeleteRoleRequest {
  int32 id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

// PermissionInfo 权限信息。
message PermissionInfo {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string resource = 4;
  string action = 5;
  string description = 6;
}

message ListPermissionsRequest {
  string resource = 1;             // 按资源类型过滤，留空不过滤
}

message ListPermissionsResponse {
  repeated PermissionInfo permissions = 1;
}

message SetRolePermissionsRequest {
  int32 role_id = 1;
  repeated string permission_codes = 2; // 覆盖式设置
}

message SetRolePermissionsResponse {
  bool success = 1;
}

// ==================== 审计日志 ====================

// AuditLogItem 单条审计日志。
message AuditLogItem {
  int64 id = 1;
  string user_uuid = 2;            // 操作人，空表示系统操作
  string action = 3;               // 操作类型，如 login / change_password
  string resource = 4;             // 资源类型，如 user / role
  string resource_id = 5;
  string ip = 6;
  string user_agent = 7;
  string detail = 8;               // 详细数据（JSON 字符串）
  int64 created_at = 9;            // 操作时间（Unix 秒）
}

message ListAuditLogsRequest {
  Pagination pagination = 1;
  string user_uuid = 2;            // 按操作人过滤，留空不过滤
  string action = 3;               // 按操作类型过滤，留空不过滤
  int64 from = 4;                  // 起始时间（Unix 秒），0 表示不限
  int64 to = 5;                    // 结束时间（Unix 秒），0 表示不限
}

message ListAuditLogsResponse {
  repeated AuditLogItem logs = 1;
  int64 total = 2;
}

// ==================== 第三方登录 ====================

// OAuthProfile 第三方平台返回的账号资料。
message OAuthProfile {
  string provider = 1;             // 平台标识：github/google/wechat/qq/apple
  string provider_user_id = 2;     // 第三方用户唯一标识
  string email = 3;                // 邮箱快照
  string nickname = 4;             // 昵称快照
  string avatar_url = 5;           // 头像快照
  string access_token = 6;         // 第三方 access token
  string refresh_token = 7;        // 第三方 refresh token
  int64 expires_at = 8;            // token 过期时间（Unix 秒，0 表示无）
  string extra = 9;                // 平台特有字段（JSON 字符串）
}

// OAuthBinding 已绑定的第三方账号（不含 token 等敏感信息）。
message OAuthBinding {
  string provider = 1;
  string provider_user_id = 2;
  string provider_email = 3;
  string provider_nickname = 4;
  string provider_avatar = 5;
  int64 last_login_at = 6;         // 最后登录时间（Unix 秒，0 表示从未登录）
  int64 created_at = 7;            // 绑定时间
}

message BindOAuthRequest {
  string uuid = 1;                 // 当前登录用户 uuid
  OAuthProfile profile = 2;
}

message BindOAuthResponse {
  bool success = 1;
}

message UnbindOAuthRequest {
  string uuid = 1;
  string provider = 2;
}

message UnbindOAuthResponse {
  bool success = 1;
}

message ListOAuthBindingsRequest {
  string uuid = 1;
}

message ListOAuthBindingsResponse {
  repeated OAuthBinding bindings = 1;
}

message OAuthLoginRequest {
  OAuthProfile profile = 1;
  DeviceContext device = 2;        // 登录后签发双令牌所需的设备上下文
}

message OAuthLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string device_id = 3;
  int64 expires_in = 4;
  int64 refresh_expires_in = 5;
  UserInfo user = 6;
  bool is_new_user = 7;            // 是否为本次自动注册的新用户
}
