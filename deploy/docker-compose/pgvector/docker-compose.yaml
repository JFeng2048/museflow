services:
  pgvector:
    image: pgvector/pgvector:pg18
    restart: always
    container_name: pgvector
    ports:
      - "5432:5432"
    volumes:
      # 数据持久化（遵循 PG18 新规则，挂载到父目录）
      - pgdata:/var/lib/postgresql
      # 【新增】挂载自定义配置文件进行性能调优
      - ./custom_postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # 【新增】挂载初始化脚本目录（用于自动创建扩展等）
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@museflow
      POSTGRES_DB: museflow
    # 【新增】资源限制，避免容器占用过多宿主机资源
    deploy:
      resources:
        limits:
          cpus: '4'      # 限制最大使用 4 个 CPU 核心
          memory: 8G     # 限制最大使用 8GB 内存
        reservations:
          cpus: '2'
          memory: 4G
    # 健康检查（保留）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d museflow"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 日志管理（保留）
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # 优雅停止（保留）
    stop_grace_period: 60s
    # 【新增】自定义网络，方便后续与其他服务（如应用）通信
    networks:
      - backend

# 【新增】自定义网络
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgdata:
    # 【可选】生产环境可使用本地持久化或云存储驱动
    # driver: local