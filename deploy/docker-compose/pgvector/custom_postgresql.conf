# =============================================
# PostgreSQL 性能调优 (针对 pgvector 向量检索)
# 假设硬件: 8核CPU, 16GB 内存
# =============================================

# --------------------------
# 连接与并发设置
# --------------------------
max_connections = 100              # 根据应用并发量调整，过大会消耗内存
superuser_reserved_connections = 3

# --------------------------
# 内存设置 (关键)
# --------------------------
# shared_buffers 建议设为物理内存的 25%，用于缓存数据页
shared_buffers = 4GB               # 16GB * 25% = 4GB

# work_mem 用于排序、哈希等内部操作，向量检索时会用到，不宜过大
work_mem = 32MB                    # 可根复杂查询调整，保守从32MB开始

# maintenance_work_mem 用于 VACUUM、CREATE INDEX 等维护操作
maintenance_work_mem = 1GB         # 构建索引时提升性能

# 操作系统缓存预估，用于查询优化器决策
effective_cache_size = 12GB        # 16GB * 75%

# --------------------------
# 写入性能优化 (WAL)
# --------------------------
# 提升写入性能，但故障时可能丢失更多数据，生产环境请权衡
synchronous_commit = off           # 如果追求极致数据安全，改为 on
wal_buffers = 64MB
wal_writer_delay = 200ms

# 检查点相关，适当调大以减少磁盘I/O压力
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# --------------------------
# 查询优化器
# --------------------------
# 对于表扫描方式，确保向量索引能被正确使用
enable_seqscan = on                # 保留开启，但确保成本参数合理
random_page_cost = 1.1             # 如果使用SSD，设为 1.1 或 1.0
effective_io_concurrency = 200     # SSD建议 200，机械硬盘建议 2

# --------------------------
# 日志记录 (便于问题排查)
# --------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 5000  # 记录执行超过5秒的SQL
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --------------------------
# 自动清理 (防止表膨胀)
# --------------------------
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_naptime = 30s
autovacuum_max_workers = 3

# --------------------------
# 时区与编码
# --------------------------
timezone = 'Asia/Shanghai'
client_encoding = UTF8