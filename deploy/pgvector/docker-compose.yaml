services:
  pgvector:
    image: pgvector/pgvector:pg18
    restart: always
    container_name: pgvector
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql  
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: museflow
      POSTGRES_PASSWORD: museflow
      POSTGRES_DB: museflow

volumes:
  pgdata: