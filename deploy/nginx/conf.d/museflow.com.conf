# ===================================================================
# museflow.com — 个人站点 Nginx 配置（jfeng 的个人介绍站）
# 站点内容：个人介绍，含 MuseFlow 等技术栈作品展示。
# 错误页：给 nginx 服务本身使用，位于站点 /errors/ 下。
# ===================================================================

# 错误页映射：每个状态码指向 /errors/ 下的独立页面
error_page 400 /errors/400.html;
error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 500 /errors/500.html;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;

server {
    listen 80;
    server_name museflow.com www.museflow.com;

    # 站点根目录（个人介绍页静态产物）
    root /var/www/museflow.com;
    index index.html;

    # 错误页资源：允许公开访问，便于浏览器加载 /errors/error.css
    location ^~ /errors/ {
        alias /var/www/museflow.com/errors/;
        default_type text/html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退：未知路径交给首页处理（个人站若是 SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
