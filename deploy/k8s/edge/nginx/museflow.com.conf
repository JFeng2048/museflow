# ===================================================================
# MuseFlow 应用入口 —— museflow.com（示例域名）
#
# 边缘 Nginx 是唯一终止 HTTPS、持有证书的位置：
#
#   Browser ──HTTPS──▶ 本 Nginx ──HTTP──▶ Traefik NodePort 192.168.142.121:31380
#                                            │
#                        集群内 Ingress「museflow」按 Host + Path 路由
#                        （deploy/k8s/edge/ingress）
#                          /      -> web:80            前端静态产物
#                          /api   -> api-gateway:5001  /api/v1/**
#                          /health-> api-gateway:5001  网关健康检查
#
# 因此本文件只做「整体反代 + 保留 Host」，不写路径级路由、不托管前端资源：
# 路径分流全部由集群内的 Traefik Ingress 负责。
#
# 域名唯一来源：deploy/k8s/applications/overlays/secrets.yaml 的 domain.host。
# 本文件里的 museflow.com 只是示例域名，部署时替换为 domain.host 的真实值，
# 需要同步替换的地方：server_name、证书目录名、证书签发命令。
#
# 完整设计说明：docs/cn/architecture/部署架构.md
#
# 仓库位置：deploy/k8s/edge/nginx/museflow.com.conf
# 服务器部署位置：
#   /etc/nginx/conf.d/museflow.com.conf
#   /etc/nginx/certs/museflow.com/fullchain.pem
#   /etc/nginx/certs/museflow.com/privkey.pem
# ===================================================================

# K3s 节点的 Traefik NodePort 入口；keepalive 需配合下面的
# proxy_http_version 1.1 与 Connection "" 才能复用连接。
upstream museflow_traefik {
    server 127.0.0.1:31380;
    keepalive 16;
}

# ---------------------------------------------------------------
# HTTP：只保留 ACME 校验，其余全部 301 到 HTTPS
# ---------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name museflow.com;

    # 证书续期的 HTTP-01 校验（certbot --webroot / acme.sh --webroot 模式）。
    # 使用 DNS-01 或 standalone 模式时，可以整段删除。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------
# HTTPS：终止证书 + 整体反代到集群内的 Traefik
# ---------------------------------------------------------------
server {
    # listen 后的 http2 是各版本都支持的写法；在 nginx ≥ 1.25.1 上会提示
    # 废弃告警，可改为 `listen 443 ssl;` + 单独一行 `http2 on;`。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name museflow.com;

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/certs/museflow.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/museflow.com/privkey.pem;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- 安全响应头 ----
    server_tokens off;
    # 未加 includeSubDomains：避免影响 museflow.com 下其它未启用 HTTPS 的子域
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---- 请求体上限（素材/稿件上传）----
    client_max_body_size 20m;

    # ---- 复用通用错误页（可选）----
    # 复用通用错误页（仓库 deploy/docker-compose/nginx/errors/，
    # 服务器 /var/www/museflow.com/errors/），仅覆盖网关层 502/503/504；
    # 404 不接管，交给前端 SPA 路由回退。
    # 若该目录不在本机，删除下面这 2 段（location 与 error_page）。
    location ^~ /errors/ {
        alias      /var/www/museflow.com/errors/;
        default_type text/html;
    }
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    # ---- 反代到集群内 Traefik ----
    location / {
        proxy_pass         http://museflow_traefik;
        proxy_http_version 1.1;

        # Host 必须保留真实域名：Traefik 依赖 Host 匹配 Ingress 规则
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 上游 keepalive 复用连接
        proxy_set_header Connection        "";

        # AI 生成类接口耗时较长，读/写超时放宽；连接失败则快速暴露
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 流式响应（SSE）：/api/v1/common/tasks/{task_id}/stream 会逐块下发事件，
        # 网关侧已设置 X-Accel-Buffering: no，这里同样关闭缓冲，避免事件被攒批。
        proxy_buffering off;

        # 上游已在 Traefik/Service 层做过负载与健康检查
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
