namespace: museflow

# 对外域名不在这里配置：唯一来源是 applications/overlays/secrets.yaml 的 domain，
# 由各 Chart 模板派生（Ingress host / CORS 白名单 / Turnstile hostname），
# 详见 docs/cn/architecture/部署架构.md。

apiGateway:
  replicaCount: 1
  config:
    GATEWAY_PORT: "5001"
    GATEWAY_USER_SERVICE_URL: user-service:5002
    # 模型目录 / 渠道凭证 / 系统配置由 config-service 提供（gRPC，集群内 Service 名）。
    GATEWAY_MODEL_SERVICE_URL: config-service:5004
    # GATEWAY_ALLOW_ORIGINS 由 domain 派生（<scheme>://<host>），不要在这里配置；
    # 需要额外来源时用同级 extraAllowOrigins。
    # 边缘 Nginx 终止 HTTPS，浏览器侧始终是 https，Cookie 必须带 Secure。
    GATEWAY_COOKIE_SECURE: "true"
    GATEWAY_COOKIE_SAMESITE: lax
    # 留空表示 host-only Cookie，作用域即 domain.host，无需填写父域。
    GATEWAY_COOKIE_DOMAIN: ""
    GATEWAY_GIN_MODE: ""
    # 日志只输出到 stdout，由 k8s 收集，不落盘
    LOG_LEVEL: info
    LOG_FORMAT: json
    LOG_CONSOLE: "true"

userService:
  replicaCount: 1
  config:
    USER_PORT: "5002"
    USER_ACCESS_TTL_SECONDS: "3600"
    USER_REFRESH_TTL_SECONDS: "2592000"
    USER_BCRYPT_COST: "10"
    USER_CODE_TTL_SECONDS: "600"
    USER_CODE_LENGTH: "6"
    USER_CODE_RESEND_COOLDOWN_SECONDS: "60"
    USER_QUEUE_NAME: email
    USER_QUEUE_MAX_RETRY: "3"
    USER_QUEUE_TIMEOUT_SECONDS: "30"
    USER_QUEUE_RETENTION_SECONDS: "3600"
    USER_QUEUE_STATUS_TTL_SECONDS: "600"
    USER_WORKER_CONCURRENCY: "20"
    USER_TURNSTILE_ENDPOINT: https://challenges.cloudflare.com/turnstile/v0/siteverify
    USER_TURNSTILE_TIMEOUT_SECONDS: "40"
    # USER_TURNSTILE_ALLOWED_HOSTNAMES 由 domain.host 加 extraTurnstileHostnames 拼装，
    # 不要在这里配置。
    MFA_TICKET_TTL_SECONDS: "300"
    MFA_ISSUER: MuseFlow
    MFA_SKEW: "1"
    MFA_RECOVERY_CODE_COUNT: "8"
    MFA_RECOVERY_CODE_LENGTH: "10"
    # 日志只输出到 stdout，由 k8s 收集，不落盘
    LOG_LEVEL: info
    LOG_FORMAT: json
    LOG_CONSOLE: "true"

configService:
  replicaCount: 1
  config:
    CONFIG_PORT: "5004"
    # 日志只输出到 stdout，由 k8s 收集，不落盘
    LOG_LEVEL: info
    LOG_FORMAT: json
    LOG_CONSOLE: "true"

crawl4aiService:
  replicaCount: 1
  config:
    PORT: "5003"
    DEFAULT_MAX_CONCURRENT: "5"
    DEFAULT_TIMEOUT: "60"
    MAX_RETRIES: "3"
    RETRY_BACKOFF_FACTOR: "2.0"
    RESPECT_ROBOTS_TXT: "true"
    ENABLE_STEALTH: "true"
    HEADLESS: "true"
    BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    BROWSER_TYPE: chrome

web:
  replicaCount: 1
