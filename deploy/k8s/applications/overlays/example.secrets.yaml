# ============================================================
# 对外访问域名（唯一来源）
#
# 域名相关配置只在 secrets.yaml 里配一次，其余由 Chart 模板派生：
#   ingress.host / GATEWAY_ALLOW_ORIGINS / USER_TURNSTILE_ALLOWED_HOSTNAMES
# 详见 docs/cn/architecture/部署架构.md。
# ============================================================
domain:
  host: museflow.example.com
  scheme: https

apiGateway:
  JWT_SECRET: change-me-in-prod

userService:
  secret:
    # PostgreSQL 连接参数；服务会根据 DB_* 拼装连接串。
    # 集群内使用 postgres；集群外改为数据库服务器 IP 或域名。
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: admin
    DB_PASSWORD: change-me
    DB_NAME: pgvector
    # Redis 连接参数。
    # 集群内使用 redis:6379；集群外改为 Redis 服务器地址:端口。
    REDIS_ADDR: redis:6379
    REDIS_PASSWORD: change-me
    REDIS_DB: "0"
    JWT_SECRET: change-me-in-prod

    # ---- 邮件发送（SMTP）----
    # 未配置 USER_SMTP_HOST 时服务降级为「日志模式」：验证码只写日志、不真实发信，本地联调可用。
    USER_SMTP_HOST: smtp.example.com
    USER_SMTP_PORT: "587"
    USER_SMTP_USERNAME: noreply@example.com
    USER_SMTP_PASSWORD: change-me
    USER_SMTP_FROM: noreply@example.com

    # ---- 人机验证（Cloudflare Turnstile）----
    # 【必填】服务端 Secret Key，必须与前端构建时写入的 VITE_TURNSTILE_SITE_KEY 配套。
    # 三个常见坑（都会在运行时才暴露）：
    #   1) 填成前端的 Site Key   -> Cloudflare 返回 invalid-input-secret；
    #   2) 保留 change-me 占位符 -> 同上，且错误信息具有误导性；
    #   3) 留空                 -> 人机验证降级为「跳过」，接口失去保护（仅适合本地）。
    # 另外该站点在 Cloudflare 控制台的 hostname 白名单需包含部署域名（domain.host）。
    USER_TURNSTILE_SECRET: change-me

    # ---- 管理员账号播种（USER_ADMIN_*）----
    # 服务启动时补齐系统角色；该邮箱对应的账号不存在时，用下面的密码创建并授予
    # super_admin。已存在的账号不会被改密。
    # 生产环境务必改掉示例密码。
    USER_ADMIN_EMAIL: admin@museflow.com
    USER_ADMIN_PASSWORD: admin@museflow.com
    # 昵称，默认「系统管理员」
    USER_ADMIN_NICKNAME: 系统管理员
    # 应急开关：忘记密码时置 "true"（字符串）重启一次即可重置，之后改回 "false"。
    USER_ADMIN_RESET_PASSWORD: "false"

crawl4aiService:
  API_KEY: change-me
