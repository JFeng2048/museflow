# ============================================================
# api-gateway Service - 集群内 HTTP 访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: museflow
  labels:
    app: api-gateway
    service: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  type: ClusterIP