namespace: museflow
apiGateway:
 image:
  repository: museflow/api-gateway
  tag: latest
  pullPolicy: IfNotPresent
 replicaCount: 1
 resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
 config:
  GATEWAY_PORT: "5001"
  GATEWAY_USER_SERVICE_URL: user-service:5002
  GATEWAY_ALLOW_ORIGINS: http://web
  GATEWAY_COOKIE_SECURE: "false"
  GATEWAY_COOKIE_SAMESITE: lax
  LOG_SERVICE_NAME: api-gateway
 secret:
  JWT_SECRET: change-me-in-prod
