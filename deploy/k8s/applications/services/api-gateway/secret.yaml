# ============================================================
# api-gateway Secret - 敏感配置
#
# JWT_SECRET 必须与 user-service 的 JWT_SECRET 完全一致，
# 否则网关本地验签会失败。
# 生产环境请通过 overlays 覆盖为真实值。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: museflow
type: Opaque
stringData:
  JWT_SECRET: change-me-in-prod