apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.userService.replicaCount }}
  # 同 user-service：单节点下改为先删后建，避免 surge 造成的资源死锁。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: { app: user-service-worker }
  template:
    metadata:
      labels: { app: user-service-worker }
      # ConfigMap 内容参与 Pod 模板哈希：改配置即自动滚动重启。
      # 缺少它时 helm upgrade 只换 ConfigMap，运行中的 Pod 仍持旧值，
      # 表现为「改了 values 不生效且无任何报错」，只能手工 rollout restart。
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: user-service-worker
          image: "{{ .Values.userService.workerImage.repository }}:{{ .Values.userService.workerImage.tag }}"
          imagePullPolicy: {{ .Values.userService.workerImage.pullPolicy }}
          envFrom:
            - configMapRef: { name: user-service-config }
            - secretRef: { name: user-service-secret }
          resources: {{- toYaml .Values.userService.workerResources | nindent 12 }}
