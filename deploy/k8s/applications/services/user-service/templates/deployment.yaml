apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.userService.replicaCount }}
  # 单节点集群没有多余资源做 surge：先删旧 Pod 再起新 Pod，否则新 Pod 会因资源不足
  # 一直 Pending，而旧 Pod 又不会被回收，rollout 会卡死（代价是更新期间短暂不可用）。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
      # ConfigMap 内容参与 Pod 模板哈希：改配置即自动滚动重启。
      # 缺少它时 helm upgrade 只换 ConfigMap，运行中的 Pod 仍持旧值，
      # 表现为「改了 values 不生效且无任何报错」，只能手工 rollout restart。
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: {{ .Values.userService.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: user-service-config }
            - secretRef: { name: user-service-secret }
          ports:
            - name: grpc
              containerPort: 5002
          resources: {{- toYaml .Values.userService.resources | nindent 12 }}
          readinessProbe: { tcpSocket: { port: 5002 } }
          livenessProbe: { tcpSocket: { port: 5002 } }
