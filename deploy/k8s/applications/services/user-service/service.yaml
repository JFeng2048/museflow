# ============================================================
# user-service Service - 集群内 gRPC 访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
    service: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: 5002
      name: grpc
  type: ClusterIP