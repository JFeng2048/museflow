# ============================================================
# user-service Worker Deployment - 异步任务消费端（asynq）
#
# 与 gRPC 主服务分离部署，独立消费 Redis 中的邮件队列；
# 可独立扩容，通过 USER_WORKER_CONCURRENCY 控制发信吞吐。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-worker
  namespace: default
  labels:
    app: user-service-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service-worker
  template:
    metadata:
      labels:
        app: user-service-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: user-service-worker
          image: museflow/user-service-worker:latest
          imagePullPolicy: IfNotPresent
          # 与主进程共享同一份配置与密钥（Worker 仅使用 REDIS_*/SMTP/队列配置）
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 128Mi
              cpu: "100m"
          # Worker 不对外提供服务端口，依赖 asynq 队列驱动，无需探针
          terminationGracePeriodSeconds: 30