# ============================================================
# user-service Secret - 敏感配置（系统环境变量同名读取）
#
# 变量名对应 envloader 读取规则：
#   USER_*      服务前缀，通过 New("USER").Get 读取
#   DB_* / REDIS_* / JWT_SECRET  公共配置，通过 GetCommon 读取
#
# 下述 DB/REDIS 凭据与 base/pgvector、base/redis 保持一致；
# 生产环境请通过 overlays 覆盖为真实值。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: museflow
type: Opaque
stringData:
  # PostgreSQL（对应 base/pgvector 的 postgres 服务）
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: jfeng
  DB_PASSWORD: jfeng@dmin
  DB_NAME: pgvector

  # Redis（对应 base/redis 的 redis 服务）
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: museflow
  REDIS_DB: "0"

  # 共享 JWT 签名密钥（与 api-gateway 必须一致）
  JWT_SECRET: change-me-in-prod

  # 邮件 SMTP（生产环境通过 overlays 覆盖；留空走「日志模式」）
  # USER_SMTP_HOST: smtp.example.com
  # USER_SMTP_PORT: "587"
  # USER_SMTP_USERNAME: noreply@museflow.ai
  # USER_SMTP_PASSWORD: your-smtp-password
  # USER_SMTP_FROM: noreply@museflow.ai

  # 人机验证 Turnstile 服务端密钥（生产环境必填）
  # USER_TURNSTILE_SECRET: your-turnstile-secret
  # USER_TURNSTILE_ALLOWED_HOSTNAMES: museflow.ai,www.museflow.ai