namespace: museflow
userService:
 image:
  repository: museflow/user-service
  tag: latest
  pullPolicy: IfNotPresent
 workerImage:
  repository: museflow/user-service-worker
  tag: latest
  pullPolicy: IfNotPresent
 replicaCount: 1
 resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
 workerResources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
 config:
  USER_PORT: "5002"
  USER_ACCESS_TTL_SECONDS: "3600"
  USER_REFRESH_TTL_SECONDS: "2592000"
  USER_QUEUE_NAME: email
  USER_WORKER_CONCURRENCY: "20"
  LOG_SERVICE_NAME: user-service
 secret:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: admin
  DB_PASSWORD: change-me
  DB_NAME: pgvector
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: change-me
  REDIS_DB: "0"
  JWT_SECRET: change-me-in-prod
