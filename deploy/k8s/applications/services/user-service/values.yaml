namespace: museflow
userService:
 image:
  repository: museflow/user-service
  tag: latest
  pullPolicy: IfNotPresent
 workerImage:
  repository: museflow/user-service-worker
  tag: latest
  pullPolicy: IfNotPresent
 replicaCount: 1
 # 单节点 1.9Gi 的调度现实：requests 是「调度货币」，与实际占用无关。request 虚高会让
 # 滚动更新时新 Pod 排不上（曾导致 user-service rollout 卡死），故按稳态用量给 request，
 # limits 保留余量——真涨上去由容器自己 OOM，不会拖累节点。
 resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 1Gi }
 workerResources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }
 config:
  USER_PORT: "5002"
  USER_ACCESS_TTL_SECONDS: "3600"
  USER_REFRESH_TTL_SECONDS: "2592000"
  USER_QUEUE_NAME: email
  USER_WORKER_CONCURRENCY: "20"
  LOG_SERVICE_NAME: user-service
  # USER_TURNSTILE_ALLOWED_HOSTNAMES 由 domain.host 加上下面的额外 hostname 拼装，
  # 见 templates/_helpers.tpl，不要在这里配置。
 # 除对外域名外额外允许的 Turnstile hostname（本地调试用）。
 extraTurnstileHostnames: ["localhost", "127.0.0.1"]
 secret:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: admin
  DB_PASSWORD: change-me
  DB_NAME: pgvector
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: change-me
  REDIS_DB: "0"
  JWT_SECRET: change-me-in-prod
  # 以下键由 applications/overlays/secrets.yaml 按环境注入，服务侧读取的键名与语义
  # 见 services/user-service/.env.example，这里只作说明，不要在此填真实值：
  #   USER_SMTP_HOST / USER_SMTP_PORT / USER_SMTP_USERNAME / USER_SMTP_PASSWORD / USER_SMTP_FROM
  #     未配置 USER_SMTP_HOST 时服务降级为「日志模式」：验证码只写日志、不真实发信。
  #   USER_TURNSTILE_SECRET
  #     Cloudflare Turnstile 服务端 Secret Key，必须与前端构建时写入的
  #     VITE_TURNSTILE_SITE_KEY（站点密钥）配套。
  #     填了站点密钥或占位符 -> 校验失败，日志出现 invalid-input-secret；
  #     留空 -> 人机验证降级为「跳过」，仅适合本地。
  #   USER_ADMIN_EMAIL / USER_ADMIN_PASSWORD / USER_ADMIN_NICKNAME / USER_ADMIN_RESET_PASSWORD
  #     管理员账号的邮箱、初始密码与昵称，集中定义在 overlays/secrets.yaml。
  #     服务启动时角色或账号缺失才创建并授予 super_admin，已存在不会覆盖密码；
  #     昵称默认「系统管理员」；RESET 置 "true" 可在忘记密码时重置一次。
