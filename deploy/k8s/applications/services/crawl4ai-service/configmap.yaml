# ============================================================
# crawl4ai-service ConfigMap - 非敏感环境变量
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawl4ai-config
  namespace: museflow
data:
  PORT: "5003"
  DEFAULT_MAX_CONCURRENT: "5"
  DEFAULT_TIMEOUT: "60"
  MAX_RETRIES: "3"
  RETRY_BACKOFF_FACTOR: "2.0"
  RESPECT_ROBOTS_TXT: "true"
  ENABLE_STEALTH: "true"
  HEADLESS: "true"
  LOG_LEVEL: INFO