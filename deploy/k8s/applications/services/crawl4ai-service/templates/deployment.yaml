apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.crawl4aiService.replicaCount }}
  # 单节点集群没有多余资源做 surge：先删旧 Pod 再起新 Pod。该服务还额外挂了
  # /dev/shm 的 emptyDir（sizeLimit 2Gi），surge 时等于要多挤一份内存。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: { app: crawl4ai-service }
  template:
    metadata:
      labels: { app: crawl4ai-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: crawl4ai-service
          image: "{{ .Values.crawl4aiService.image.repository }}:{{ .Values.crawl4aiService.image.tag }}"
          imagePullPolicy: {{ .Values.crawl4aiService.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: crawl4ai-config }
            - secretRef: { name: crawl4ai-secret }
          ports:
            - name: http
              containerPort: 5003
          resources: {{- toYaml .Values.crawl4aiService.resources | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          readinessProbe: { tcpSocket: { port: 5003 } }
          livenessProbe: { tcpSocket: { port: 5003 } }
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
