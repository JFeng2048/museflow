# ============================================================
# crawl4ai-service Service - 集群内访问（HTTP/gRPC 共用 5003）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: crawl4ai-service
  namespace: museflow
  labels:
    app: crawl4ai-service
    service: crawl4ai-service
spec:
  selector:
    app: crawl4ai-service
  ports:
    - port: 5003
      targetPort: 5003
      name: http
  type: ClusterIP