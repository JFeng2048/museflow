# ============================================================
# crawl4ai-service Secret - 敏感配置
#
# API_KEY 用于鉴权，调用方需在请求中携带 Authorization 头。
# 留空则禁用认证（仅本地开发）。生产环境请通过 overlays 覆盖。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: crawl4ai-secret
  namespace: default
type: Opaque
stringData:
  API_KEY: crawl4ai-service-api-key