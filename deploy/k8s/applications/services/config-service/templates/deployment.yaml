apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.configService.replicaCount }}
  # 单节点集群没有多余资源做 surge：先删旧 Pod 再起新 Pod，否则新 Pod 会因资源不足
  # 一直 Pending，而旧 Pod 又不会被回收，rollout 会卡死（代价是更新期间短暂不可用）。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: { app: config-service }
  template:
    metadata:
      labels: { app: config-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: config-service
          image: "{{ .Values.configService.image.repository }}:{{ .Values.configService.image.tag }}"
          imagePullPolicy: {{ .Values.configService.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: config-service-config }
            - secretRef: { name: config-service-secret }
          ports:
            - name: grpc
              containerPort: 5004
          resources: {{- toYaml .Values.configService.resources | nindent 12 }}
          readinessProbe: { tcpSocket: { port: 5004 } }
          livenessProbe: { tcpSocket: { port: 5004 } }
