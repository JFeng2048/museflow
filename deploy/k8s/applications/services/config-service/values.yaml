namespace: museflow
configService:
 image:
  repository: museflow/config-service
  tag: latest
  pullPolicy: IfNotPresent
 replicaCount: 1
 # 同 user-service：单节点下 request 按稳态用量给，limits 保留余量，
 # request 虚高会让滚动更新时新 Pod 排不上而卡死 rollout。
 resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "500m", memory: 512Mi }
 config:
  CONFIG_PORT: "5004"
  # 日志只输出到 stdout，由 k8s 收集，不落盘
  LOG_LEVEL: info
  LOG_FORMAT: json
  LOG_CONSOLE: "true"
 secret:
  # PostgreSQL 连接参数；config-service 按共享 DB_* 键拼装连接串，
  # 取值必须与 user-service 的 DB_* 保持一致（同一个库、同一套 schema）。
  # 集群内用 postgres 服务名，端口见 base/overlays/values.yaml 的 postgres.service.port。
  DB_HOST: postgres
  DB_PORT: "15432"
  DB_USER: admin
  DB_PASSWORD: change-me
  DB_NAME: pgvector
  # 模型凭证加密主密钥（AES-256-GCM），只有本服务持有明文：
  # model_provider.api_key、user_model_provider.api_key 与机密系统配置都在这里
  # 加解密，api-gateway 只经 gRPC 转发，不接触密钥。
  # 必须是 32 字节；换密钥等于作废全部历史密文，启动时强校验。
  # 生成方式见 services/config-service/.env.example，生产必须在
  # applications/overlays/secrets.yaml 覆盖，切勿提交到仓库。
  MODEL_SECRET_KEY: change-me-generate-a-32-byte-secret
