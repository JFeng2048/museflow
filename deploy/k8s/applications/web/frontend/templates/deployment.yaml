apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  # 同其它业务服务：单节点下改为先删后建，避免 surge 造成的资源死锁。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      # ConfigMap 内容参与 Pod 模板哈希：改配置即自动滚动重启。
      # 缺少它时 helm upgrade 只换 ConfigMap，运行中的 Pod 仍持旧值，
      # 表现为「改了 values 不生效且无任何报错」，只能手工 rollout restart。
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: 80 }
          livenessProbe:
            httpGet: { path: /, port: 80 }
      volumes:
        - name: web-config
          configMap: { name: web-config }
