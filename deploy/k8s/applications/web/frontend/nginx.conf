# ============================================================
# web Nginx 站点配置
#
# 只托管 SPA 构建产物：这里不做任何反向代理，/api 由集群内 Traefik
# Ingress 直接转发到 api-gateway（见 deploy/k8s/edge/ingress）。
#
# 该文件同时被：
#   1. Helm Chart 通过 values.yaml 的 web.nginxConfig 生成 web-config ConfigMap；
#   2. Dockerfile 作为镜像默认站点配置。
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
