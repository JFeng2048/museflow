# ============================================================
# web Nginx 站点配置
#
# 静态托管 SPA 构建产物，并将 /api 反向代理到 api-gateway，
# 与开发环境 Vite 代理行为保持一致（/api 前缀原样透传）。
#
# 该文件同时被：
#   1. kustomization.yaml 通过 configMapGenerator 生成 web-config ConfigMap；
#   2. Dockerfile 作为镜像默认站点配置。
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # /api 反向代理到 api-gateway（原样透传 /api/v1/...）
    location /api/ {
        proxy_pass http://api-gateway:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 暴露网关健康检查
    location /health {
        proxy_pass http://api-gateway:5001/health;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}