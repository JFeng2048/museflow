# ============================================================
# Kustomization - 组合 web 的所有资源
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 列出所有资源文件
resources:
  - service.yaml
  - deployment.yaml

# 由 nginx.conf 生成站点配置 ConfigMap（与 Dockerfile 复用同一份配置）
configMapGenerator:
  - name: web-config
    files:
      - nginx.conf

# 统一添加标签（可选）
commonLabels:
  app.kubernetes.io/part-of: museflow
  app.kubernetes.io/managed-by: kustomize

# 统一添加命名空间
namespace: museflow