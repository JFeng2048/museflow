# ============================================================
# web Deployment - 前端 SPA
#
# 构建上下文为 web/ 目录本身。构建命令（仓库根目录）：
#   docker build -f deploy/k8s/applications/web/Dockerfile -t museflow/web ./web
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: museflow/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            # 覆盖默认 Nginx 站点配置（含 /api 反代）
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 128Mi
              cpu: "100m"
          # 健康检查
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          terminationGracePeriodSeconds: 30
      volumes:
        # 站点配置 ConfigMap
        - name: web-config
          configMap:
            name: web-config