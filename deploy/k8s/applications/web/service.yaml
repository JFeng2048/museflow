# ============================================================
# web Service - 集群内访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: default
  labels:
    app: web
    service: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP