#
# ============================================================
# values.yaml - postgres-chart 默认配置
# ============================================================
# 覆盖方式（优先级从低到高）：
#   1. 本文件（默认值）
#   2. -f values-dev.yaml / values-prod.yaml 等覆盖文件
#   3. --set key=value 命令行参数
#   （多次 -f 时后面的文件覆盖前面的文件）

# ------------------------------------------------------------
# 基础信息
# ------------------------------------------------------------
# 资源所属命名空间（保持与旧 Kustomize 一致）
namespace: museflow

# 覆盖资源名称
# 注意: 必须保持 "postgres"，因为 user-service 通过 DB_HOST=postgres 引用本服务
nameOverride: ""
fullnameOverride: postgres

# 副本数（有状态服务通常为 1）
replicaCount: 1

# ------------------------------------------------------------
# 镜像配置
# ------------------------------------------------------------
image:
  repository: pgvector/pgvector
  # 也可以写全: pgvector/pgvector:pg18
  tag: pg18
  pullPolicy: IfNotPresent

# 私有仓库拉取凭证（可选）
imagePullSecrets: []

# ------------------------------------------------------------
# 敏感信息（凭据）
# 注意: 开发环境可直接写在 values.yaml / values-dev.yaml；
#       生产环境建议通过 existingSecret 引用 Kubernetes Secret，
#       或使用 helm secrets / SOPS 等工具加密 values 文件。
# ------------------------------------------------------------
credentials:
  # POSTGRES_USER
  user: admin
  # POSTGRES_PASSWORD
  password: admin@museflow
  # POSTGRES_DB
  database: museflow
  # 若已存在 Secret（键为 POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB），
  # 设置此项后将不再自建 Secret，且忽略上面的 user/password/database
  existingSecret: ""

# ------------------------------------------------------------
# 服务配置
# ------------------------------------------------------------
service:
  type: ClusterIP
  # 对外端口
  port: 5432
  # 容器端口
  targetPort: 5432
  # 端口名称
  portName: postgres
  # 仅 service.type=NodePort 时生效：指定集群节点上的对外端口（30000-32767），
  # 留空则由集群自动分配
  nodePort: ""

# ------------------------------------------------------------
# PostgreSQL 配置（configmap.yaml 内容）
# ------------------------------------------------------------
config:
  # postgresql.conf 内容，挂载到 /etc/postgresql/postgresql.conf
  postgresqlConf: |
    # =============================================
    # PostgreSQL 性能调优 (针对 pgvector 向量检索)
    # 硬件: 2核CPU, 2GB 内存
    # =============================================

    # --------------------------
    # 连接与并发设置
    # --------------------------
    max_connections = 50
    superuser_reserved_connections = 3

    # --------------------------
    # 内存设置 (关键)
    # --------------------------
    shared_buffers = 512MB
    work_mem = 16MB
    maintenance_work_mem = 256MB
    effective_cache_size = 1.5GB

    # --------------------------
    # 写入性能优化 (WAL)
    # --------------------------
    synchronous_commit = off
    wal_buffers = 16MB
    wal_writer_delay = 200ms
    checkpoint_completion_target = 0.9
    max_wal_size = 1GB
    min_wal_size = 256MB

    # --------------------------
    # 查询优化器
    # --------------------------
    enable_seqscan = on
    random_page_cost = 1.1
    effective_io_concurrency = 200

    # --------------------------
    # 日志记录
    # --------------------------
    log_destination = 'stderr'
    logging_collector = on
    log_directory = '/var/log/postgresql'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 5000
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0

    # --------------------------
    # 自动清理
    # --------------------------
    autovacuum = on
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    autovacuum_naptime = 30s
    autovacuum_max_workers = 2

    # --------------------------
    # 时区与编码
    # --------------------------
    timezone = 'Asia/Shanghai'
    client_encoding = UTF8

  # 容器启动时按文件名顺序执行的初始化脚本，挂载到 /docker-entrypoint-initdb.d
  initScripts:
    "01-create-extension.sql": |
      -- 启用 pgvector 扩展
      CREATE EXTENSION IF NOT EXISTS vector;
      -- 可在此添加其他初始化 SQL

# ------------------------------------------------------------
# 数据持久化 (statefulset.yaml 中的 volumeClaimTemplates)
# ------------------------------------------------------------
persistence:
  enabled: true
  # 存储类，留空则使用集群默认
  storageClass: ""
  # 持久化大小
  size: 10Gi
  accessMode: ReadWriteOnce
  # PGDATA 子目录，避免挂载点根目录文件干扰
  pgdataSubPath: pgdata
  # 若已存在 PVC，可以指定名称（如恢复备份场景），默认按模板自动创建
  existingClaim: ""

# ------------------------------------------------------------
# 资源限制与健康检查
# ------------------------------------------------------------
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

# 探针使用的连接参数
# 留空时自动使用 credentials.user / credentials.database，通常无需修改
probe:
  username: ""
  database: ""

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ------------------------------------------------------------
# 调度与高级配置
# ------------------------------------------------------------
terminationGracePeriodSeconds: 60

# 额外环境变量（追加到容器 env 中）
extraEnv: []
  # - name: TZ
  #   value: Asia/Shanghai

# 额外标签 / 注解
podLabels: {}
podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}