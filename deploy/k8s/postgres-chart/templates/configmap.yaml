#
# ============================================================
# configmap.yaml - PostgreSQL 配置文件与初始化脚本
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres-chart.configName" . }}
  namespace: {{ include "postgres-chart.namespace" . }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
data:
  postgresql.conf: |
{{ .Values.config.postgresqlConf | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres-chart.initScriptsName" . }}
  namespace: {{ include "postgres-chart.namespace" . }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.config.initScripts }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}