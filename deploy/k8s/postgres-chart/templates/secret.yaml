#
# ============================================================
# secret.yaml - PostgreSQL 敏感信息
# 当 credentials.existingSecret 为空时创建；
# 否则复用外部 Secret，不重复创建。
# ============================================================
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-chart.secretName" . }}
  namespace: {{ include "postgres-chart.namespace" . }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.database | quote }}
{{- end }}