#
# ============================================================
# service.yaml - PostgreSQL Service（集群内访问）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres-chart.fullname" . }}
  namespace: {{ include "postgres-chart.namespace" . }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "postgres-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
      name: {{ .Values.service.portName }}