#
# ============================================================
# Chart.yaml - pgvector / PostgreSQL Helm Chart 元数据
# ============================================================
apiVersion: v2
name: postgres-chart
description: |
  PostgreSQL 16/17/18 (pgvector/pgvector 镜像) 有状态部署 Chart。
  内置 pgvector 扩展、性能调优配置、初始化脚本与健康检查，
  面向 MuseFlow 的向量检索场景。
type: application

# 每次修改 Chart 或模板后递增该版本号
version: 0.1.0

# 应用版本（对应 pgvector 镜像 tag 的默认值）
appVersion: "pg18"

# 关键词，便于仓库检索
keywords:
  - postgres
  - postgresql
  - pgvector
  - vector
  - database

maintainers:
  - name: MuseFlow

# 可选: 如果需要接入外部 PostgreSQL 服务，可在这里声明依赖
# dependencies: []