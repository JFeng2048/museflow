# ============================================================
# SearXNG ConfigMap - 配置文件
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: museflow
data:
  settings.yml: |
    # settings.yml
    use_default_settings: true

    search:
      formats:
        - html
        - json

    server:
      limiter: false
      public_instance: false

    engines:
      - name: duckduckgo
        engine: duckduckgo
        disabled: false
        timeout: 10.0

      - name: bing
        disabled: false
        timeout: 10.0

      - name: baidu
        disabled: false
        timeout: 10.0

      - name: sogou
        disabled: true

      - name: 360search
        disabled: true

      - name: google
        disabled: true

      - name: startpage
        disabled: true

      - name: brave
        disabled: true

      - name: wikipedia
        disabled: true

      - name: stackoverflow
        disabled: true

      - name: csdn
        disabled: true

      - name: github
        disabled: true

      - name: ahmia
        disabled: true

      - name: torch
        disabled: true

      - name: radio_browser
        disabled: true

      - name: wikidata
        disabled: true