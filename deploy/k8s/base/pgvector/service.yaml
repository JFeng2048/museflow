# ============================================================
# PostgreSQL Service - 集群内访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
    service: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  # ClusterIP 为默认类型，仅在集群内部可访问
  # 如需外部访问，可改为 NodePort 或 LoadBalancer
  type: ClusterIP