# ============================================================
# Kustomization - 组合 redis 的所有资源
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 列出所有资源文件
resources:
  - secret.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml

# 统一添加标签（可选）
commonLabels:
  app.kubernetes.io/part-of: infrastructure
  app.kubernetes.io/managed-by: kustomize

# 统一添加命名空间
namespace: default