# ============================================================
# Redis Service - 集群内访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
    service: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  # ClusterIP 为默认类型，仅在集群内部可访问
  # 如需外部访问，可改为 NodePort 或 LoadBalancer
  type: ClusterIP