# ============================================================
# Redis ConfigMap - 配置文件
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: default
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no
    dir /data
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    daemonize no
    logfile "/var/log/redis/redis.log"