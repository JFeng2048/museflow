namespace: museflow
image:
  repository: pgvector/pgvector
  tag: pg18
  pullPolicy: IfNotPresent
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent
  user: admin
  password: ""
  database: museflow
  service:
    # NodePort 模式下，port 是集群内 Service 端口，nodePort 是节点对外端口。
    # Kubernetes 默认 NodePort 范围为 30000-32767。
    type: ClusterIP
    port: 5432
    nodePort: ""
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  config: |
    max_connections = 50
    shared_buffers = 512MB
    work_mem = 16MB
    maintenance_work_mem = 256MB
    effective_cache_size = 1.5GB
    synchronous_commit = off
    timezone = 'Asia/Shanghai'
