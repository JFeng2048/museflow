# ============================================================
# Ollama Service - 集群内访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: default
  labels:
    app: ollama
    service: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: ollama
  # ClusterIP 为默认类型，仅在集群内部可访问
  type: ClusterIP