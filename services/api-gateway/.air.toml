# Air 热重载配置 —— api-gateway
# 用法：在 services/api-gateway 目录执行 `air`
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go run ./cmd/server"
  bin = "./tmp/api-gateway"
  include_ext = ["go", "mod", "sum"]
  exclude_dir = ["tmp", "docs", "bin", "test"]
  exclude_file = []
  # swag 文档变更也触发重载，便于 Swagger 注解即时生效
  exclude_regex = ["_test\\.go", "docs/.*\\.go"]
  include_dir = ["internal", "cmd", "../../proto"]
  delay = 1000
  stop_on_error = false

[log]
  time = true

[misc]
  clean_on_exit = true
