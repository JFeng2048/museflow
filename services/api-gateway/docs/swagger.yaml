  /common/email/send-code:
    post:
      consumes:
      - application/json
      description: |-
        按场景发送邮箱验证码：register（注册校验）/ login（验证码登录）/ reset_password（密码重置）/ change_email（修改邮箱）；避免账号枚举，邮箱不存在时也返回成功
        邮件通过异步队列发送，接口只负责生成验证码并入队，立即返回 task_id（HTTP 202）；
        客户端可用 task_id 订阅 GET /common/tasks/{task_id}/stream 获取实时发送进度。
        请求需携带 Cloudflare Turnstile 令牌（captcha_token）；令牌一次性，每次发送都要重新获取。
      parameters:
      - description: 邮箱、场景与人机验证令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_auth_dto.SendVerifyCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: 已受理，异步发送中
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_common_dto.SendVerifyCodeData'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 人机验证未通过，请重新完成验证
          schema:
            $ref: '#/definitions/errcode.Response'
        "429":
          description: 发送过于频繁
          schema:
            $ref: '#/definitions/errcode.Response'
        "503":
          description: 人机验证服务暂时不可用
          schema:
            $ref: '#/definitions/errcode.Response'
      summary: 发送邮箱验证码
      tags:
      - common-公共
  /common/refresh:
    post:
      description: 从 Cookie 读取 refresh token 换取新的 access token，刷新后旧 refresh 轮转
      produces:
