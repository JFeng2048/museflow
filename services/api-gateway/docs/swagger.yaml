            $ref: '#/definitions/errcode.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
        "409":
          description: 渠道编码已存在
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 新增平台渠道
      tags:
      - model-模型与系统配置
  /admin/model-providers/{id}:
