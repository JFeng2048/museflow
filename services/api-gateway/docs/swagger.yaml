basePath: /api/v1
definitions:
  errcode.Response:
    properties:
      code:
        example: 2000
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.AdminUserItem:
    properties:
      roles:
        example:
        - admin
        - user
        items:
          type: string
        type: array
      updated_at:
        example: 1756280000
        type: integer
      user:
        $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_user_dto.UserInfo'
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.AssignRoleRequest:
    properties:
      role_code:
        example: admin
        maxLength: 50
        type: string
    required:
    - role_code
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.AuditLogItem:
    properties:
      action:
        example: login
        type: string
      created_at:
        example: 1756280000
        type: integer
      detail:
        example: '{"reason":"bad_password"}'
        type: string
      id:
        example: 1
        type: integer
      ip:
        example: 203.0.113.10
        type: string
      resource:
        example: auth
        type: string
      resource_id:
        example: 3f7c1e2a-5b6d-4e8f-9a0b-1c2d3e4f5a6b
        type: string
      user_agent:
        type: string
      user_uuid:
        example: 3f7c1e2a-5b6d-4e8f-9a0b-1c2d3e4f5a6b
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.AuditLogList:
    properties:
      logs:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.AuditLogItem'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 1024
        type: integer
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.CreateRoleRequest:
    properties:
      code:
        example: auditor
        maxLength: 50
        type: string
      description:
        example: 负责内容审核
        maxLength: 500
        type: string
      name:
        example: 审核员
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.PermissionInfo:
    properties:
      action:
        example: read
        type: string
      code:
        example: user:read
        type: string
      description:
        example: 查看用户列表与详情
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 查看用户
        type: string
      resource:
        example: user
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.PermissionList:
    properties:
      permissions:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.PermissionInfo'
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.RoleInfo:
    properties:
      code:
        example: super_admin
        type: string
      created_at:
        example: 1756270000
        type: integer
      description:
        example: 拥有全部系统权限
        type: string
      id:
        example: 1
        type: integer
      is_system:
        example: true
        type: boolean
      name:
        example: 超级管理员
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.RoleList:
    properties:
      roles:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.RoleInfo'
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.SetRolePermissionsRequest:
    properties:
      permission_codes:
        example:
        - novel:read
        - novel:write
        items:
          type: string
        minItems: 1
        type: array
    required:
    - permission_codes
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.UpdateRoleRequest:
    properties:
      description:
        example: 负责内容审核
        maxLength: 500
        type: string
      name:
        example: 审核员
        maxLength: 100
        type: string
    required:
    - name
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.UpdateUserStatusRequest:
    properties:
      status:
        enum:
        - 1
        - 2
        - 3
        - 4
        example: 2
        type: integer
    required:
    - status
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.UserDetail:
    properties:
      permissions:
        example:
        - user:read
        - novel:write
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.AdminUserItem'
    type: object
  github_com_museflow_api-gateway_internal_dto_admin_dto.UserList:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 128
        type: integer
      users:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.AdminUserItem'
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.ChangeEmailRequest:
    properties:
      code:
        example: "824913"
        type: string
      new_email:
        example: new@museflow.ai
        type: string
    required:
    - code
    - new_email
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.DisableMFARequest:
    properties:
      code:
        example: "824913"
        type: string
    required:
    - code
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.LoginRequest:
    properties:
      device_name:
        description: DeviceName 设备名称，用于设备列表展示，可选
        example: Chrome on Windows
        maxLength: 100
        type: string
      email:
        example: author@museflow.ai
        type: string
      password:
        example: P@ssw0rd123
        type: string
    required:
    - email
    - password
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.LoginResponseData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 3600
        type: integer
      mfa_ticket:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      recovery_codes:
        example:
        - '["a1b2c3d4"'
        - '"e5f6g7h8"]'
        items:
          type: string
        type: array
      remaining_recovery_codes:
        example: 8
        type: integer
      requires_mfa:
        example: false
        type: boolean
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_user_dto.UserInfo'
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.LoginWithCodeRequest:
    properties:
      code:
        example: "824913"
        type: string
      device_name:
        description: DeviceName 设备名称，用于设备列表展示，可选
        example: Chrome on Windows
        maxLength: 100
        type: string
      email:
        example: author@museflow.ai
        type: string
    required:
    - code
    - email
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.MFASetupData:
    properties:
      otpauth_url:
        example: otpauth://totp/MuseFlow:author@museflow.ai?secret=JBSWY3DPEHPK3PXP&issuer=MuseFlow
        type: string
      secret:
        example: JBSWY3DPEHPK3PXP
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.MFAStatusData:
    properties:
      enabled:
        example: true
        type: boolean
      remaining_recovery_codes:
        example: 8
        type: integer
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.RefreshData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 3600
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.RegenerateRecoveryCodesRequest:
    properties:
      code:
        example: "824913"
        type: string
    required:
    - code
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.RegisterRequest:
    properties:
      code:
        description: Code 注册邮箱验证码，调 /auth/email/send-code（scene=register）获取
        example: "824913"
        type: string
      email:
        example: author@museflow.ai
        type: string
      nickname:
        example: 墨流作者
        maxLength: 100
        type: string
      password:
        example: P@ssw0rd123
        maxLength: 72
        minLength: 8
        type: string
    required:
    - code
    - email
    - password
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.ResetPasswordRequest:
    properties:
      code:
        example: "824913"
        type: string
      email:
        example: author@museflow.ai
        type: string
      new_password:
        example: NewP@ss456
        maxLength: 72
        minLength: 8
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.SendVerifyCodeRequest:
    properties:
      email:
        example: author@museflow.ai
        type: string
      scene:
        enum:
        - register
        - login
        - reset_password
        - change_email
        example: register
        type: string
    required:
    - email
    - scene
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.VerifyMFALoginRequest:
    properties:
      code:
        example: "824913"
        type: string
      device_name:
        description: DeviceName 设备名称，用于设备列表展示，可选
        example: Chrome on Windows
        maxLength: 100
        type: string
      mfa_ticket:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    required:
    - code
    - mfa_ticket
    type: object
  github_com_museflow_api-gateway_internal_dto_auth_dto.VerifyMFARequest:
    properties:
      code:
        example: "824913"
        type: string
    required:
    - code
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.ChangePasswordRequest:
    properties:
      new_password:
        example: NewP@ss456
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        example: OldP@ss123
        type: string
    required:
    - new_password
    - old_password
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.OAuthBinding:
    properties:
      created_at:
        example: 1756270000
        type: integer
      last_login_at:
        example: 1756280000
        type: integer
      provider:
        example: github
        type: string
      provider_avatar:
        type: string
      provider_email:
        example: dev@github.com
        type: string
      provider_nickname:
        example: octocat
        type: string
      provider_user_id:
        example: gh-123456
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.OAuthBindingList:
    properties:
      bindings:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_user_dto.OAuthBinding'
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.PermissionListData:
    properties:
      permissions:
        example:
        - user:read
        - novel:write
        items:
          type: string
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.SessionInfo:
    properties:
      device_id:
        example: a1b2c3d4e5f6
        type: string
      device_name:
        example: Chrome on Windows
        type: string
      last_refresh_time:
        example: 1756283600
        type: integer
      login_time:
        example: 1756280000
        type: integer
      token_id:
        example: 9f8e7d6c-5b4a-3928-1706-0f1e2d3c4b5a
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.SessionList:
    properties:
      sessions:
        items:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_user_dto.SessionInfo'
        type: array
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.UpdateProfileRequest:
    properties:
      avatar_url:
        example: https://cdn.museflow.ai/avatar/1.png
        type: string
      bio:
        example: 专注于玄幻小说创作
        maxLength: 500
        type: string
      nickname:
        example: 墨流作者
        maxLength: 100
        type: string
    type: object
  github_com_museflow_api-gateway_internal_dto_user_dto.UserInfo:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        example: 1756270000
        type: integer
      email:
        example: author@museflow.ai
        type: string
      email_verified:
        example: false
        type: boolean
      last_login_at:
        example: 1756280000
        type: integer
      mfa_enabled:
        example: false
        type: boolean
      nickname:
        example: 墨流作者
        type: string
      phone:
        example: "13800138000"
        type: string
      phone_verified:
        example: false
        type: boolean
      status:
        example: 1
        type: integer
      uuid:
        example: 3f7c1e2a-5b6d-4e8f-9a0b-1c2d3e4f5a6b
        type: string
    type: object
host: localhost:5001
info:
  contact:
    name: MuseFlow Team
  description: |-
    MuseFlow AI 小说生成平台的 API 网关，统一对外暴露 HTTP 接口并转发到后端 gRPC 微服务。

    认证采用双令牌机制：
    - access token：短期（默认 1 小时），通过响应 body 返回，请求时放入 Authorization 头
    - refresh token：长期（默认 30 天），存于 HttpOnly Cookie，用于换取新的 access token
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: MuseFlow API Gateway
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: 按操作人、操作类型、时间范围筛选，分页返回
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        name: page_size
        type: integer
      - description: 按操作人 UUID 过滤
        in: query
        name: user_uuid
        type: string
      - description: 按操作类型过滤，如 login / change_password
        in: query
        name: action
        type: string
      - description: 起始时间（Unix 秒）
        in: query
        name: from
        type: integer
      - description: 结束时间（Unix 秒）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.AuditLogList'
              type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - admin-管理后台
  /admin/permissions:
    get:
      parameters:
      - description: 按资源类型过滤，如 user / novel
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.PermissionList'
              type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 权限列表
      tags:
      - admin-管理后台
  /admin/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.RoleList'
              type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 角色列表
      tags:
      - admin-管理后台
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.RoleInfo'
              type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
        "409":
          description: 角色编码已存在
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - admin-管理后台
  /admin/roles/{id}:
    delete:
      description: 系统内置角色不可删除；删除后清理相关用户的权限缓存
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限或系统角色不可删
          schema:
            $ref: '#/definitions/errcode.Response'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - admin-管理后台
    put:
      consumes:
      - application/json
      description: 系统内置角色不可修改
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限或系统角色不可改
          schema:
            $ref: '#/definitions/errcode.Response'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 编辑角色
      tags:
      - admin-管理后台
  /admin/roles/{id}/permissions:
    put:
      consumes:
      - application/json
      description: 覆盖式设置角色的权限集合，变更后清理该角色下所有用户的权限缓存
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 权限编码列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.SetRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 分配成功
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
        "404":
          description: 权限编码不存在
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 为角色分配权限
      tags:
      - admin-管理后台
  /admin/users:
    get:
      description: 分页查询用户，支持关键字（邮箱 / 昵称）与状态筛选、排序
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: 按邮箱或昵称模糊搜索
        in: query
        name: keyword
        type: string
      - description: 状态：1=正常 2=冻结 3=已注销 4=待审核
        in: query
        name: status
        type: integer
      - description: 排序字段：created_at/updated_at/email/nickname/status
        in: query
        name: order_by
        type: string
      - description: 是否倒序
        in: query
        name: desc
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.UserList'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - admin-管理后台
