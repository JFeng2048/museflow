          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 设备校验失败
          schema:
            $ref: '#/definitions/errcode.Response'
      summary: 刷新访问令牌
      tags:
      - common-公共
  /common/tasks/{task_id}/stream:
    get:
      description: |-
        以 Server-Sent Events 持续推送任务状态，供前端展示「发送中 / 已发送 / 发送失败」。
        事件名即任务状态：pending（已入队）/ sending（发送中）/ retrying（重试中）/ success / failed；
        收到 success 或 failed 后服务端关闭连接。建议用 EventSource 接入。
      parameters:
      - description: 任务 ID，来自 /common/email/send-code 的返回
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: '事件流：event: <status> / data: {\"task_id\":..,\"status\":..,\"message\":..}'
          schema:
            type: string
        "400":
          description: 缺少任务 ID
          schema:
            $ref: '#/definitions/errcode.Response'
        "404":
          description: 任务不存在或已过期
          schema:
            $ref: '#/definitions/errcode.Response'
      summary: 订阅异步任务进度（SSE）
      tags:
      - common-公共
