host: localhost:5001
info:
  contact:
    name: MuseFlow Team
  description: |-
    MuseFlow AI 小说生成平台的 API 网关，统一对外暴露 HTTP 接口并转发到后端 gRPC 微服务。

    认证采用双令牌机制：
    - access token：短期（默认 1 小时），通过响应 body 返回，请求时放入 Authorization 头
    - refresh token：长期（默认 30 天），存于 HttpOnly Cookie，用于换取新的 access token
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: MuseFlow API Gateway
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: 按操作人、操作类型、时间范围筛选，分页返回
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        name: page_size
        type: integer
      - description: 按操作人 UUID 过滤
        in: query
        name: user_uuid
        type: string
      - description: 按操作类型过滤，如 login / change_password
        in: query
        name: action
        type: string
      - description: 起始时间（Unix 秒）
        in: query
        name: from
        type: integer
      - description: 结束时间（Unix 秒）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_admin_dto.AuditLogList'
              type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - admin-管理后台
  /admin/model-providers:
    get:
      description: 分页查询平台模型渠道，支持关键字（编码 / 名称）与状态筛选
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: 按编码或名称模糊搜索
        in: query
        name: keyword
        type: string
      - description: 是否只返回启用中的渠道
        in: query
        name: only_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/errcode.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_model_dto.ProviderList'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/errcode.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/errcode.Response'
      security:
      - BearerAuth: []
      summary: 平台渠道列表
      tags:
      - model-模型与系统配置
    post:
      consumes:
      - application/json
      description: 新增平台模型渠道，api_key 加密落库后只回显末 4 位
      parameters:
      - description: 渠道信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_museflow_api-gateway_internal_dto_model_dto.CreateProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
