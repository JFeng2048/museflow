[project]
name = "crawl4ai-service"
version = "0.1.0"
description = "Standalone crawler microservice wrapping Crawl4AI intelligent extraction"
authors = [{ name = "JobInsight" }]
readme = "README.md"
requires-python = ">=3.13"
# 两个版本接口（HTTP / gRPC）共用同一份爬取 / 提取核心逻辑
# （src/crawler.py + src/extractor.py，依赖 Crawl4AI 浏览器渲染）。
# 基础依赖是两份接口都需要的；HTTP / gRPC 各自的依赖通过
# optional-dependencies 分组，打包时可只装其中一组：
#   uv sync --extra http   # 只装 HTTP 版本依赖
#   uv sync --extra grpc   # 只装 gRPC 版本依赖
#   uv sync --extra http --extra grpc   # 两个版本都装（同时运行）
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "crawl4ai>=0.5.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

# ---- 版本接口依赖分组 ----
[project.optional-dependencies]
# HTTP（FastAPI）版本接口：RESTful JSON + Swagger
http = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]
# gRPC 版本接口：proto/crawl 契约 + 生成桩代码
grpc = [
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 关键修改：指定包的位置
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]